<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>麦门省钱助手</title>
<style>
  :root {
    --ink: #1d1d1f; --muted: #6e6e73; --faint: #a1a1a6; --line: #e6e6e9;
    --bg: #fafaf9; --card: #fff; --red: #da291c; --green: #0f7b4f; --amber: #fff8e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 52px 20px 90px; }
  h1 { font-size: 31px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.5px; }
  .lede { margin: 0; color: var(--muted); font-size: 14.5px; }
  .lede b { color: var(--ink); font-weight: 500; }
  .badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; font-size: 12px; color: var(--red); background: #fff; border: 1px solid var(--line); padding: 4px 11px; border-radius: 999px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-top: 20px; }
  .card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .card-h h2 { font-size: 16px; font-weight: 500; margin: 0; display: flex; align-items: center; gap: 8px; }
  .step { font-size: 11px; color: #fff; background: var(--ink); width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; flex: none; }
  .reload { font-size: 12.5px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 4px 2px; }
  .reload:hover { color: var(--ink); }

  .metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .m { background: #f6f6f5; border-radius: 10px; padding: 14px 15px; }
  .m .k { font-size: 12px; color: var(--muted); }
  .m .v { font-size: 26px; font-weight: 600; letter-spacing: -0.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .m .v small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 3px; }
  .m.warn .v { color: #b3261e; }

  .list { margin-top: 14px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid #f0f0f0; font-size: 14px; }
  .item:first-child { border-top: 0; }
  .item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .pr { color: var(--ink); font-variant-numeric: tabular-nums; }
  .item .tg { font-size: 11px; color: var(--faint); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; flex: none; }
  .claim { margin-top: 14px; padding: 12px 14px; background: var(--amber); border: 1px solid #f2e3b8; border-radius: 10px; }
  .claim p { margin: 0 0 10px; font-size: 13.5px; }
  .claim .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .pill { font-size: 12.5px; background: #fff; border: 1px solid #eadcba; border-radius: 999px; padding: 3px 10px; }
  .btn-line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .btn {
    height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); font: 500 13.5px inherit; cursor: pointer;
  }
  .btn:hover { border-color: #cfcfd3; }
  .btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.primary:hover { background: #c02419; }
  .btn:disabled { opacity: .55; cursor: default; }
  .tiny { font-size: 12px; color: var(--faint); }

  .field { display: flex; align-items: center; gap: 12px; padding: 9px 0; flex-wrap: wrap; }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .field > label { width: 66px; color: var(--muted); font-size: 13.5px; flex: none; white-space: nowrap; }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .stepper button { width: 36px; height: 36px; border: 0; background: #fff; font-size: 17px; color: var(--ink); cursor: pointer; }
  .stepper button:hover { background: #f5f5f7; }
  .stepper span { width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
  input[type="text"], input[type="number"] {
    height: 36px; padding: 0 11px; border: 1px solid var(--line); border-radius: 10px;
    font: inherit; color: var(--ink); background: #fff; outline: none; width: 120px;
  }
  input:focus { border-color: #b9b9bd; }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .chip { padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-size: 13px; color: var(--muted); cursor: pointer; }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .go { width: 100%; margin-top: 8px; height: 44px; border: 0; border-radius: 11px; background: var(--red); color: #fff; font: 500 15px inherit; cursor: pointer; }
  .go:hover { background: #c02419; }
  .go:disabled { background: #d9a5a1; cursor: default; }

  .store { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .store b { font-size: 17px; font-weight: 600; }
  .store small { color: var(--muted); }
  .base { margin-top: 12px; padding: 11px 14px; background: #f6f6f5; border-radius: 10px; font-size: 13px; color: var(--muted); }
  .base b { color: var(--ink); font-size: 15px; }

  .plan { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-top: 11px; }
  .plan:first-of-type { border-color: #f0c9c5; background: #fffdfd; }
  .plan-h { display: flex; align-items: center; gap: 9px; }
  .rank { flex: none; width: 21px; height: 21px; border-radius: 6px; background: var(--ink); color: #fff; font-size: 11.5px; display: grid; place-items: center; }
  .plan:first-of-type .rank { background: var(--red); }
  .plan-name { font-weight: 500; }
  .row2 { display: flex; align-items: baseline; gap: 12px; margin-top: 9px; flex-wrap: wrap; }
  .price { font-size: 25px; font-weight: 600; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
  .per { color: var(--muted); font-size: 13px; }
  .save { font-size: 12px; color: var(--green); background: #eaf5ef; border-radius: 999px; padding: 3px 10px; }
  .lines { margin-top: 11px; border-top: 1px dashed var(--line); padding-top: 9px; }
  .lines .li { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 3px 0; }
  .lines .li b { color: var(--ink); font-weight: 400; font-variant-numeric: tabular-nums; }
  .ord { margin-top: 8px; font-size: 13px; }
  .ord .oh { color: var(--ink); font-weight: 500; margin-top: 8px; }
  .ord .ol { color: var(--muted); padding-left: 12px; font-size: 12.5px; }
  .meta { margin-top: 7px; font-size: 12.5px; color: var(--muted); }
  .orderbar { margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .confirm { margin-top: 13px; border: 1px solid #f0c9c5; background: #fffdfd; border-radius: 10px; padding: 14px 15px; }
  .confirm .warn { color: #a3231a; font-size: 13px; margin: 0 0 10px; }
  .confirm .kv { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; color: var(--muted); }
  .confirm .kv b { color: var(--ink); font-weight: 500; }
  .confirm select { height: 34px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 13px; padding: 0 8px; background: #fff; }
  .okbox { margin-top: 13px; border: 1px solid #cfe7db; background: #f4faf7; border-radius: 10px; padding: 14px 15px; }
  .okbox .no { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; color: var(--muted); word-break: break-all; }
  .okbox a.pay { display: inline-block; margin-top: 10px; background: var(--red); color: #fff; text-decoration: none; padding: 9px 15px; border-radius: 9px; font-size: 13.5px; font-weight: 500; }
  .okbox a.pay:hover { background: #c02419; }
  .foot { margin-top: 24px; padding-top: 15px; border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); }
  .err { color: #a3231a; background: #fdf1f0; border: 1px solid #f5d4d0; border-radius: 10px; padding: 12px 14px; font-size: 13px; }
  .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid #fff6; border-top-color: #fff; border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -2px; margin-right: 7px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .skel { color: var(--faint); font-size: 13px; padding: 6px 0; }
  @media (max-width: 620px) { .metrics { grid-template-columns: 1fr; } .field > label { width: 100%; } .wrap { padding-top: 30px; } }
</style>
</head>
<body>
<div class="wrap">

  <h1>麦门省钱助手</h1>
  <p class="lede">不是帮你点餐，是<b>帮你把账户里已经付过钱的东西用掉</b>。</p>
  <p class="lede" style="margin-top:4px">券、积分、优惠，先盘点清楚，再决定今天这顿怎么点。</p>
  <div class="badge">WorkBuddy × 麦当劳 MCP</div>

  <section class="card">
    <div class="card-h">
      <h2><span class="step">1</span>你的券资产</h2>
      <button class="reload" id="reloadWallet">刷新</button>
    </div>
    <div id="wallet"><div class="skel">正在查你的账户…</div></div>
  </section>

  <section class="card">
    <div class="card-h"><h2><span class="step">2</span>今天这顿怎么点</h2></div>
    <div class="field">
      <label>几个人</label>
      <div class="stepper"><button type="button" id="minus">−</button><span id="people">2</span><button type="button" id="plus">+</button></div>
    </div>
    <div class="field">
      <label>预算</label>
      <input type="number" id="budget" value="100" min="10" step="10" />
      <span class="tiny">元</span>
      <label class="check"><input type="checkbox" id="perPerson" /> 按人均算</label>
    </div>
    <div class="field">
      <label>不吃什么</label>
      <div class="chips" id="chips"></div>
    </div>
    <div class="field">
      <label>去哪家</label>
      <input type="text" id="city" value="武汉" style="width:88px" />
      <input type="text" id="keyword" value="光谷" style="width:140px" />
      <span class="tiny">商圈名比门店全名好使</span>
    </div>
    <div class="field">
      <label>加分项</label>
      <label class="check"><input type="checkbox" id="nutri" /> 顺便看热量</label>
    </div>
    <button class="go" id="go">算一算怎么点最划算</button>
    <div class="tiny" style="margin-top:9px">推荐和比价不需要你确认；下单会先弹确认，且默认不付款。</div>
  </section>

  <div id="result"></div>

  <div class="foot">麦当劳 MCP（mcp.mcd.cn）· 到店自取 · 价格以所选门店实时计算为准 · 本项目非麦当劳官方产品</div>
</div>

<script>
const AVOID = ['辣', '牛肉', '鸡肉', '猪肉', '鱼', '咖啡', '冰'];
let people = 2;
const avoidSet = new Set();
const $ = (id) => document.getElementById(id);
const yuan = (fen) => (Number(fen) / 100).toFixed(2);

$('chips').innerHTML = AVOID.map((a) => `<span class="chip" data-k="${a}">${a}</span>`).join('');
$('chips').onclick = (e) => {
  const el = e.target.closest('.chip'); if (!el) return;
  const k = el.dataset.k;
  if (avoidSet.has(k)) { avoidSet.delete(k); el.classList.remove('on'); }
  else { avoidSet.add(k); el.classList.add('on'); }
};
$('minus').onclick = () => { people = Math.max(1, people - 1); $('people').textContent = people; };
$('plus').onclick = () => { people = Math.min(20, people + 1); $('people').textContent = people; };

/* ---------- 券资产 ---------- */
async function loadWallet() {
  $('wallet').innerHTML = '<div class="skel">正在查你的账户…</div>';
  try {
    const r = await fetch('/api/wallet', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const w = await r.json();
    if (w.error) throw new Error(w.error);
    renderWallet(w);
  } catch (e) {
    $('wallet').innerHTML = `<div class="err">查不到账户信息：${e.message}</div>`;
  }
}

function renderWallet(w) {
  const acc = w.account || {};
  const mine = w.mine || [];
  const claimable = w.claimable || [];
  const html = `
    <div class="metrics">
      <div class="m"><div class="k">手里有券</div><div class="v">${mine.length}<small>张</small></div></div>
      <div class="m"><div class="k">还能领</div><div class="v">${claimable.length}<small>张</small></div></div>
      <div class="m ${acc.expired > 0 ? 'warn' : ''}">
        <div class="k">积分已过期</div>
        <div class="v">${acc.expired != null ? Math.round(acc.expired) : '—'}<small>分</small></div>
      </div>
    </div>

    ${mine.length ? `<div class="list">${mine.map((c) => `
      <div class="item">
        <span class="nm">${c.name}</span>
        ${c.daysLeft != null ? `<span class="tg">${c.daysLeft} 天后过期</span>` : ''}
        <span class="pr">${c.price != null ? '¥' + c.price.toFixed(2) : '—'}</span>
      </div>`).join('')}</div>` : '<div class="meta">账户里还没有券。</div>'}

    ${claimable.length ? `
      <div class="claim">
        <p><b>还有 ${claimable.length} 张券没领</b>，领了才能算进这一单。</p>
        <div class="row">${claimable.map((c) => `<span class="pill">${c.title}</span>`).join('')}</div>
        <div class="btn-line">
          <button class="btn primary" id="doClaim">一键领取</button>
          <span class="tiny">会真实写入你的麦当劳账户</span>
        </div>
      </div>` : '<div class="meta" style="margin-top:12px">麦麦省的券都已经领完了。</div>'}

    ${acc.expiringThisMonth > 0 ? `<div class="meta">这个月还有 ${acc.expiringThisMonth} 积分要过期。</div>` : ''}
    <div class="foot" style="border:0;padding:0;margin-top:12px">本次读取账户用了 ${w.calls || '—'} 次 MCP 调用</div>
  `;
  $('wallet').innerHTML = html;

  const btn = $('doClaim');
  if (btn) btn.onclick = async () => {
    if (!confirm(`这会真的把 ${claimable.length} 张券领到你自己的麦当劳账户里。\n券是免费的，领了不会花钱，但要确认继续吗？`)) return;
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>领取中…';
    try {
      const r = await fetch('/api/claim', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      renderWallet(d.wallet);
      const tip = document.createElement('div');
      tip.className = 'meta';
      tip.style.color = '#0f7b4f';
      tip.textContent = `已领取，手里从 ${d.before} 张变成 ${d.after} 张。现在再算这一单，能用的券更多了。`;
      $('wallet').prepend(tip);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = '重试';
      alert('领取失败：' + e.message);
    }
  };
}

/* ---------- 方案 ---------- */
$('go').onclick = async () => {
  const btn = $('go');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>正在查门店、菜单和你手里的券…';
  $('result').innerHTML = '';
  try {
    const r = await fetch('/api/plan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        people,
        budget: Number($('budget').value) || null,
        budgetPerPerson: $('perPerson').checked,
        avoid: [...avoidSet],
        city: $('city').value.trim(),
        keyword: $('keyword').value.trim(),
        nutrition: $('nutri').checked,
      }),
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    renderPlans(d);
  } catch (e) {
    $('result').innerHTML = `<section class="card"><div class="err">出错了：${e.message}</div></section>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '再算一次';
  }
};

function renderPlans(d) {
  current = d;
  const h = d.history && d.history.summary;
  const head = `
    <section class="card">
      <div class="store">
        <b>${d.store.storeName}</b>
        <small>门店 ${d.store.storeCode}${d.store.distance != null ? ' · ' + d.store.distance + 'm' : ''} · 到店自取</small>
      </div>
      ${d.coupons.length ? `<div class="claim" style="background:#eaf5ef;border-color:#cfe7db"><p style="margin:0">这一单能用 ${d.coupons.length} 张券：<b>${d.coupons.map((c) => c.title).join('、')}</b></p></div>` : ''}
      ${h ? `<div class="base">你过去 ${h.count} 笔订单，单均 <b>¥${h.avgAmount}</b>${h.last ? '　最近一单：' + h.last.desc : ''}</div>` : ''}
      ${d.baseline ? `<div class="base">一样样分开单点要 <b>¥${yuan(d.baseline.price)}</b>（${d.baseline.label}）—— 下面这些都比它便宜</div>` : ''}
    </section>`;

  const plans = d.plans.map((p, i) => {
    const sv = p.savedVsBaseline;
    const body = p.ordersDetail
      ? `<div class="ord">${p.ordersDetail.map((o, k) => `
          <div class="oh">第 ${k + 1} 单${o.couponTitle ? '（用券：' + o.couponTitle + '）' : '（常规单）'}　实付 ¥${yuan(o.price)}</div>
          ${o.items.map((it) => `<div class="ol">${it.name} ×${it.quantity}　¥${yuan(it.subtotal)}</div>`).join('')}
        `).join('')}</div>`
      : `<div class="lines">${p.items.map((it) => `<div class="li"><span>${it.name} ×${it.quantity}</span><b>¥${yuan(it.subtotal)}</b></div>`).join('')}</div>`;

    return `<div class="plan">
      <div class="plan-h"><span class="rank">${i + 1}</span><span class="plan-name">${p.name}</span></div>
      <div class="row2">
        <span class="price">¥${yuan(p.price)}</span>
        <span class="per">人均 ¥${p.perPerson.toFixed(2)}</span>
        ${sv > 0 ? `<span class="save">比单点省 ¥${yuan(sv)}</span>` : ''}
      </div>
      ${body}
      ${p.content ? `<div class="meta">套餐默认含：${p.content.items.join(' + ')}</div>` : ''}
      ${p.nutrition ? `<div class="meta">约 ${p.nutrition.kcal} 大卡 · 蛋白质 ${p.nutrition.protein}g · 脂肪 ${p.nutrition.fat}g</div>` : ''}
      <div class="meta">${p.note}</div>
      <div class="orderbar">
        <button class="btn primary" data-order="${i}">${p.ordersDetail ? `按这个方案下 ${p.ordersDetail.length} 笔订单` : '就按这个来下单'}</button>
        <span class="tiny">会真实创建订单，付不付由你决定</span>
      </div>
      <div id="ord-${i}"></div>
    </div>`;
  }).join('');

  const more = d.alternatives.length
    ? `<div class="meta" style="margin-top:13px">其他候选：${d.alternatives.map((a) => a.name + ' ¥' + yuan(a.price)).join('　·　')}</div>` : '';
  const empty = d.plans.length ? '' : `<div class="err">预算内没有够吃的组合，放宽预算或去掉忌口试试。</div>`;

  $('result').innerHTML = head + `<section class="card">
    <div class="card-h"><h2><span class="step">3</span>给你的方案</h2></div>
    ${empty}${plans}${more}
    <div class="foot">本次真实调用麦当劳 MCP ${d.mcpCalls} 次 · 试了 ${d.candidatesTested} 种组合，${d.valid} 种有效</div>
  </section>`;

  document.querySelectorAll('[data-order]').forEach((btn) => {
    btn.onclick = () => showConfirm(Number(btn.dataset.order));
  });
}

/* ---------- 下单 ---------- */
let current = null;

function orderPayload(idx, takeWayCode) {
  const p = current.plans[idx];
  const orders = p.ordersDetail
    ? p.rawOrders.map((o) => ({ items: o.items, couponTitle: o.couponTitle }))
    : [{ items: p.rawItems }];
  return { storeCode: current.store.storeCode, takeWayCode, orders };
}

function showConfirm(idx) {
  const p = current.plans[idx];
  const multi = !!p.ordersDetail;
  const rows = multi
    ? p.ordersDetail.map((o, k) => `<div class="kv"><span>第 ${k + 1} 单${o.couponTitle ? '（' + o.couponTitle + '）' : ''}</span><b>¥${yuan(o.price)}</b></div>`).join('')
    : `<div class="kv"><span>${p.items.map((i) => i.name + '×' + i.quantity).join(' + ')}</span><b>¥${yuan(p.price)}</b></div>`;

  $('ord-' + idx).innerHTML = `
    <div class="confirm">
      <p class="warn">确认后会<b>真实创建${multi ? ' ' + p.ordersDetail.length + ' 笔' : '一笔'}订单</b>（未支付）。订单会出现在你的麦当劳账号里，不付款也能取消。</p>
      ${rows}
      <div class="kv" style="border-top:1px solid #f0e0de;margin-top:6px;padding-top:8px"><span>合计</span><b>¥${yuan(p.price)}</b></div>
      <div class="kv"><span>取餐方式</span><select id="way-${idx}"><option value="eat-in">堂食</option><option value="take-in-store">外带</option></select></div>
      <div class="btn-line" style="margin-top:12px">
        <button class="btn primary" id="do-${idx}">确认下单</button>
        <button class="btn" id="no-${idx}">先不下了</button>
        <span class="tiny">${current.store.storeName}</span>
      </div>
    </div>`;

  $('no-' + idx).onclick = () => { $('ord-' + idx).innerHTML = ''; };
  $('do-' + idx).onclick = async () => {
    const btn = $('do-' + idx);
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>下单中…';
    try {
      const body = orderPayload(idx, $('way-' + idx).value);
      const r = await fetch('/api/order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      renderOrderResult(idx, d.orders);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = '重试';
      $('ord-' + idx).insertAdjacentHTML('afterbegin', `<div class="err">下单失败：${e.message}</div>`);
    }
  };
}

function renderOrderResult(idx, orders) {
  const box = orders.map((o, k) => `
    <div style="margin-top:${k ? '14px' : '0'}">
      <div class="kv"><span>${orders.length > 1 ? '第 ' + (k + 1) + ' 笔 · ' : ''}${o.status}${o.couponTitle ? '（' + o.couponTitle + '）' : ''}</span><b>¥${o.realAmount.toFixed(2)}</b></div>
      <div class="no">${o.orderId}</div>
      ${o.payH5Url ? `<a class="pay" href="${o.payH5Url}" target="_blank" rel="noopener">打开支付页</a>` : ''}
      <button class="btn" data-cancel="${o.orderId}" style="margin-left:8px">取消这笔</button>
    </div>`).join('');

  $('ord-' + idx).innerHTML = `<div class="okbox">
    <div style="font-size:13.5px;margin-bottom:10px"><b>已创建 ${orders.length} 笔订单</b>（未支付）。付款由你决定，不付也可以取消。</div>
    ${box}
    <div class="meta" style="margin-top:10px">支付页要在手机上打开，或手机扫码。路演时可以直接投屏让评委扫。</div>
    ${orders.length > 1 ? `<button class="btn" id="cancelAll-${idx}" style="margin-top:10px">全部取消</button>` : ''}
  </div>`;

  $('ord-' + idx).querySelectorAll('[data-cancel]').forEach((b) => {
    b.onclick = async () => {
      b.disabled = true;
      b.textContent = '取消中…';
      try {
        const r = await fetch('/api/cancel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ orderIds: [b.dataset.cancel] }) });
        const d = await r.json();
        if (d.error || !d.results?.[0]?.ok) throw new Error(d.error || '未知原因');
        b.textContent = '已取消';
      } catch (e) {
        b.disabled = false;
        b.textContent = '取消这笔';
        alert('取消失败：' + e.message);
      }
    };
  });

  const all = document.getElementById('cancelAll-' + idx);
  if (all) all.onclick = async () => {
    all.disabled = true;
    all.textContent = '取消中…';
    try {
      const r = await fetch('/api/cancel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ orderIds: orders.map((o) => o.orderId) }) });
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      all.textContent = '已全部取消';
      $('ord-' + idx).querySelectorAll('[data-cancel]').forEach((b) => { b.textContent = '已取消'; b.disabled = true; });
    } catch (e) {
      all.disabled = false;
      all.textContent = '重试';
    }
  };
}

loadWallet();

// 演示用：加 ?demo=1 打开页面就自动算一次
if (new URLSearchParams(location.search).get('demo')) {
  setTimeout(() => $('go').click(), 600);
}
</script>
